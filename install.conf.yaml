- defaults:
    link:
      create: true   # create parent dirs (e.g. ~/.claude) as needed
      relink: true   # replace an existing symlink that points elsewhere

# ~/.claude holds Claude Code runtime state (sessions, projects, plugins, the
# machine-local settings.local.json). We never link the whole directory — only
# the specific config we own, so runtime state is left untouched.
- create:
    - ~/.claude

# The architectural laws are vendored as a git submodule (promptctl/laws) so Claude Code
# and opencode read one source of truth. Initialise it on a fresh checkout.
- shell:
    - description: Initialise vendored submodules (promptctl/laws)
      command: git submodule update --init --recursive

- link:
    ~/.claude/skills:
      path: config/claude/skills
    ~/.claude/commands:
      path: config/claude/commands
    ~/.claude/CLAUDE.md:
      # force: this replaces a pre-existing real CLAUDE.md (the repo is the
      # source of truth for it).
      path: config/claude/CLAUDE.md
      force: true
    ~/.claude/settings.json:
      # User-global Claude Code config (not runtime state) — owns the TTS Stop
      # hook registration, so the on-demand voice toggle restores on a fresh
      # machine. force: replaces the pre-existing real file.
      path: config/claude/settings.json
      force: true
    # Individual hook scripts only — the flag file (tts-enabled) and the
    # fired log are runtime state that stay as real files in ~/.claude/hooks.
    ~/.claude/hooks/tts-stop-hook.sh:
      path: config/claude/hooks/tts-stop-hook.sh
    ~/.claude/hooks/tts-toggle.sh:
      path: config/claude/hooks/tts-toggle.sh
    # Background worker (summarize -> synthesize -> play), driven by the Stop hook.
    ~/.claude/hooks/tts-speak.sh:
      path: config/claude/hooks/tts-speak.sh
    # Kill button: silence the current reply without disabling TTS.
    ~/.claude/hooks/tts-silence.sh:
      path: config/claude/hooks/tts-silence.sh
    # skhd global hotkey (⌃⌥X) that fires the TTS kill button.
    ~/.config/skhd/skhdrc:
      path: config/skhd/skhdrc
    # litmux — one-command clean tmux session for the current repo. Lands in
    # ~/go/bin, which is already on PATH (via ~/.zshenv, where `lit` lives too),
    # so no shell-config change is needed. Relocate if you keep tools elsewhere.
    ~/go/bin/litmux:
      path: bin/litmux
    # opencode reads the SAME laws as Claude Code. It cannot run Claude Code plugins, so
    # this router plugin ports the behaviour: a system-prompt injection routes to ONE
    # medium each turn, and laws_{code,prompt,prose,ticket} tools return the vendored
    # skill bodies on demand. Auto-loaded from ~/.config/opencode/plugins/.
    ~/.config/opencode/plugins/laws-router.js:
      path: config/opencode/plugins/laws-router.js
