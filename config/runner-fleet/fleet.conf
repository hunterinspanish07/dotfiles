# fleet.conf — THE source of truth for this host's self-hosted GitHub Actions runners.
#
# Before this file, a runner existed only as a prose `docker run` snippet copied into
# three per-repo docs/CI-RUNNERS.md. Nothing executed those snippets, so nothing kept
# them true, and by 2026-09-04 all three had drifted from the live containers (ht-runner
# had gained a per-runner workdir bind that no doc recorded, and every doc still pinned a
# digest that had been replaced). Six maps, one territory, no way to tell which lied.
# Now this file is the map and `runner-fleet.sh` redraws the territory from it; the docs
# point here instead of repeating it. [LAW:one-source-of-truth]
#
# Adding a fourth runner is a fourth ROW — data, no logic edit. If a new runner ever
# needs a code change here, this table is missing a column; add the column rather than
# special-casing the runner. [LAW:composability]

# The runner image. Pinned to a tag here and resolved to an immutable digest at create
# time, so what actually ran is recorded in the log without a human hand-editing a
# sha256 on every refresh.
#
# The runners are created with DISABLE_AUTO_UPDATE=true, which makes this line the ONLY
# way the runner version ever moves. That is the point. Left to itself the runner
# self-updates in place: it renames /actions-runner/bin to bin.<version>, unpacks the new
# release, and swaps it back. When that sequence is interrupted the container is left with
# NO bin at all, `./bin/Runner.Listener` exits 127 forever, and — because the wreckage
# lives in the container's writable layer — no restart can ever heal it. That is exactly
# what happened to all three runners on this host (ht-runner 817 restarts, grounded 1974,
# odyssey 3741, each with bin.2.336.0 and bin.2.337.0 present and bin deleted). A
# container that patches itself is a second, unversioned source of truth about what is
# installed; the image is the first. Keep one. [LAW:one-source-of-truth]
#
# Refresh deliberately with:  runner-fleet.sh up --force
IMAGE=myoung34/github-runner:ubuntu-noble

# runner <container>       <owner/repo>                            <runner-name>          <pat-file>
#
# The Actions work directory is NOT a column: it is derived as /runner-work/<container
# minus its -runner suffix>. Two runners sharing one work dir is a real bug that already
# bit this host — odyssey and grounded both bound the same /runner-work, so each restart
# wiped the other's in-flight _actions cache and jobs failed in ~23s at actions/checkout.
# Deriving the path from the container name makes that collision unrepresentable rather
# than merely discouraged. [LAW:types-are-the-program]
#
# <pat-file> holds ONLY the fine-grained PAT (scope: that one repo, Administration:
# Read & write), mode 600, never committed. It is read at create time and passed to
# docker; nothing else in this repo ever touches it. [LAW:effects-at-boundaries]
runner ht-runner        hunterinspanish07/HopefulTranslation  mac-colima-1           ~/.ht-runner-pat
runner grounded-runner  hunterinspanish07/Grounded            mac-colima-grounded-1  ~/.grounded-runner-pat
runner odyssey-runner   hunterinspanish07/Odyssey             mac-colima-odysseus-1  ~/.odyssey-runner-pat
